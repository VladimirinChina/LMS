openapi: 3.0.3
info:
  title: LMS API
  version: 1.0.0
  description: 'Бэкенд LMS-системы: курсы, уроки, платежи, подписки. Авторизация через
    JWT: заголовок `Authorization: Bearer <access-токен>`.'
paths:
  /courses/:
    get:
      operationId: courses_list
      description: Обычный пользователь видит только свои курсы, модератор все. Ответ
        постраничный.
      summary: Список курсов
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Курсы
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseList'
          description: ''
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
    post:
      operationId: courses_create
      description: Недоступно модераторам. Владелец проставляется автоматически.
      summary: Создать курс
      tags:
      - Курсы
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Course'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Course'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Course'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
        '400':
          description: 'Ошибка валидации: в теле запроса некорректные данные'
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
        '403':
          description: Недостаточно прав для этого действия
  /courses/{id}/:
    get:
      operationId: courses_retrieve
      description: Включает количество уроков, список уроков и признак подписки. Доступно
        модератору и владельцу объекта.
      summary: Получить курс
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Курс.
        required: true
      tags:
      - Курсы
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
        '403':
          description: Недостаточно прав для этого действия
        '404':
          description: Объект не найден
    put:
      operationId: courses_update
      description: Доступно модератору и владельцу объекта.
      summary: Изменить курс (полностью)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Курс.
        required: true
      tags:
      - Курсы
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Course'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Course'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Course'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
        '400':
          description: 'Ошибка валидации: в теле запроса некорректные данные'
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
        '403':
          description: Недостаточно прав для этого действия
        '404':
          description: Объект не найден
    patch:
      operationId: courses_partial_update
      description: Доступно модератору и владельцу объекта.
      summary: Изменить курс (частично)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Курс.
        required: true
      tags:
      - Курсы
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCourse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCourse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCourse'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
          description: ''
        '400':
          description: 'Ошибка валидации: в теле запроса некорректные данные'
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
        '403':
          description: Недостаточно прав для этого действия
        '404':
          description: Объект не найден
    delete:
      operationId: courses_destroy
      description: Доступно только владельцу, модераторам удаление недоступно.
      summary: Удалить курс
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Курс.
        required: true
      tags:
      - Курсы
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
        '403':
          description: Недостаточно прав для этого действия
        '404':
          description: Объект не найден
  /lessons/:
    get:
      operationId: lessons_list
      description: Обычный пользователь видит только свои уроки, модератор все. Ответ
        постраничный.
      summary: Список уроков
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Уроки
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLessonList'
          description: ''
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
  /lessons/{id}/:
    get:
      operationId: lessons_retrieve
      description: Доступно модератору и владельцу объекта.
      summary: Получить урок
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Уроки
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
        '403':
          description: Недостаточно прав для этого действия
        '404':
          description: Объект не найден
  /lessons/{id}/delete/:
    delete:
      operationId: lessons_delete_destroy
      description: Доступно только владельцу, модераторам удаление недоступно.
      summary: Удалить урок
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Уроки
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
        '403':
          description: Недостаточно прав для этого действия
        '404':
          description: Объект не найден
  /lessons/{id}/update/:
    put:
      operationId: lessons_update_update
      description: Доступно модератору и владельцу объекта.
      summary: Изменить урок (полностью)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Уроки
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lesson'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Lesson'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Lesson'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
        '400':
          description: 'Ошибка валидации: в теле запроса некорректные данные'
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
        '403':
          description: Недостаточно прав для этого действия
        '404':
          description: Объект не найден
    patch:
      operationId: lessons_update_partial_update
      description: Доступно модератору и владельцу объекта.
      summary: Изменить урок (частично)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Уроки
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLesson'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLesson'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLesson'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
        '400':
          description: 'Ошибка валидации: в теле запроса некорректные данные'
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
        '403':
          description: Недостаточно прав для этого действия
        '404':
          description: Объект не найден
  /lessons/create/:
    post:
      operationId: lessons_create_create
      description: Недоступно модераторам. Владелец проставляется автоматически. Ссылка
        в `video_url` и ссылки в описании могут вести только на youtube.com.
      summary: Создать урок
      tags:
      - Уроки
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lesson'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Lesson'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Lesson'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
        '400':
          description: 'Ошибка валидации: в теле запроса некорректные данные'
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
        '403':
          description: Недостаточно прав для этого действия
  /subscriptions/:
    post:
      operationId: subscriptions_create
      description: Если подписки пользователя на курс нет, она создаётся, если есть,
        удаляется. Результат описан в поле `message`.
      summary: Подписаться на курс или отписаться
      tags:
      - Подписки
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
          description: ''
        '400':
          description: Не указан id курса (поле `course`)
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
        '404':
          description: Курс не найден
  /users/:
    get:
      operationId: users_list
      description: Возвращает только общую информацию (без фамилии и истории платежей).
      summary: Список пользователей
      tags:
      - Пользователи
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPublic'
          description: ''
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
  /users/{id}/:
    get:
      operationId: users_retrieve
      description: Свой профиль возвращается полностью (с историей платежей), чужой
        только с общей информацией (без фамилии и платежей).
      summary: Профиль пользователя
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Пользователи
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
        '404':
          description: Объект не найден
  /users/{id}/delete/:
    delete:
      operationId: users_delete_destroy
      description: Удалить можно только свой профиль.
      summary: Удалить свой профиль
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Пользователи
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
        '403':
          description: Недостаточно прав для этого действия
        '404':
          description: Объект не найден
  /users/{id}/update/:
    put:
      operationId: users_update_update
      description: Редактировать можно только свой профиль.
      summary: Изменить свой профиль (полностью)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Пользователи
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: 'Ошибка валидации: в теле запроса некорректные данные'
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
        '403':
          description: Недостаточно прав для этого действия
        '404':
          description: Объект не найден
    patch:
      operationId: users_update_partial_update
      description: Редактировать можно только свой профиль.
      summary: Изменить свой профиль (частично)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Пользователи
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: 'Ошибка валидации: в теле запроса некорректные данные'
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
        '403':
          description: Недостаточно прав для этого действия
        '404':
          description: Объект не найден
  /users/payments/:
    get:
      operationId: users_payments_list
      description: Поддерживает фильтрацию по курсу (`course`), уроку (`lesson`) и
        способу оплаты (`method`), а также сортировку по дате оплаты.
      summary: Список платежей
      parameters:
      - in: query
        name: course
        schema:
          type: integer
      - in: query
        name: lesson
        schema:
          type: integer
      - in: query
        name: method
        schema:
          type: string
          title: Способ оплаты
          enum:
          - cash
          - transfer
        description: |-
          * `cash` - Наличные
          * `transfer` - Перевод на счёт
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -paid_at
          - paid_at
        description: 'Сортировка по дате оплаты: `paid_at` по возрастанию, `-paid_at`
          по убыванию. По умолчанию новые платежи сверху.'
      tags:
      - Платежи
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
          description: ''
        '401':
          description: 'Не авторизован: токен не передан, просрочен или недействителен'
  /users/register/:
    post:
      operationId: users_register_create
      description: Email должен быть уникальным (без учёта регистра), пароль проходит
        стандартные валидаторы Django (минимум 8 символов).
      summary: Регистрация пользователя
      tags:
      - Авторизация
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegister'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegister'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegister'
          description: ''
        '400':
          description: 'Ошибка валидации: в теле запроса некорректные данные'
  /users/token/:
    post:
      operationId: users_token_create
      description: Принимает `email` и `password`, возвращает `access` и `refresh`.
        При неверных данных возвращается 401.
      summary: Получить пару JWT-токенов
      tags:
      - Авторизация
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /users/token/refresh/:
    post:
      operationId: users_token_refresh_create
      description: Принимает `refresh`, возвращает новый `access`. Если refresh недействителен,
        возвращается 401.
      summary: Обновить access-токен
      tags:
      - Авторизация
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        description:
          type: string
          nullable: true
        lessons_count:
          type: integer
          readOnly: true
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
          readOnly: true
        is_subscribed:
          type: boolean
          readOnly: true
        title:
          type: string
          title: Название
          maxLength: 200
        preview:
          type: string
          format: uri
          nullable: true
          title: Превью
        owner:
          type: integer
          readOnly: true
          nullable: true
          title: Владелец
      required:
      - id
      - is_subscribed
      - lessons
      - lessons_count
      - owner
      - title
    Lesson:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        description:
          type: string
          nullable: true
        video_url:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        title:
          type: string
          title: Название
          maxLength: 200
        preview:
          type: string
          format: uri
          nullable: true
          title: Превью
        course:
          type: integer
          title: Курс
        owner:
          type: integer
          readOnly: true
          nullable: true
          title: Владелец
      required:
      - course
      - id
      - owner
      - title
    MethodEnum:
      enum:
      - cash
      - transfer
      type: string
      description: |-
        * `cash` - Наличные
        * `transfer` - Перевод на счёт
    PaginatedCourseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
